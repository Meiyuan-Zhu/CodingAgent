spring.application.name=coding-agent-backend
server.port=8080
agent.workspace.root=../workspaces/demo
spring.datasource.url=jdbc:h2:file:./data/coding-agent;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# The API key is read from the environment variable named below; never commit the key.
# Tests override this provider to mock so automated checks stay offline and deterministic.
agent.model.provider=openai-compatible
agent.model.base-url=https://api.deepseek.com
agent.model.name=deepseek-v4-flash
agent.model.api-key-env=DEEPSEEK_API_KEY
agent.model.timeout=60s
agent.model.temperature=0.2
agent.model.tool-protocol=native-tools
